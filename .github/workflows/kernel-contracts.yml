name: PhantomSensor kernel contracts

on:
  pull_request:
    paths:
      - "PhantomSensor/PhantomSensor/Callbacks/FileSystem/PreCreate.c"
      - "PhantomSensor/PhantomSensor/Communication/CommPort.c"
      - "PhantomSensor/PhantomSensor/Communication/CommPort.h"
      - "PhantomSensor/PhantomSensor/Communication/ScanBridge.c"
      - "PhantomSensor/PhantomSensor/Communication/ScanBridge.h"
      - "tests/kernel_contracts/**"
      - ".github/workflows/kernel-contracts.yml"
  push:
    paths:
      - "PhantomSensor/PhantomSensor/Callbacks/FileSystem/PreCreate.c"
      - "PhantomSensor/PhantomSensor/Communication/CommPort.c"
      - "PhantomSensor/PhantomSensor/Communication/CommPort.h"
      - "PhantomSensor/PhantomSensor/Communication/ScanBridge.c"
      - "PhantomSensor/PhantomSensor/Communication/ScanBridge.h"
      - "tests/kernel_contracts/**"
      - ".github/workflows/kernel-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Scanner identity and lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run host-safe contracts
        run: python3 tests/kernel_contracts/test_phantom_sensor_scanner_identity.py
